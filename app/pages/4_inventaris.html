<!DOCTYPE html>

<html lang="id">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Inventaris - SAKU POS</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<link
    rel="stylesheet"
    href="../assets/css/style.css"
>
```

</head>

<body>

<div class="saku-shell">

```
<div id="sidebar-container"></div>


<main class="saku-content">


    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

        <div>

            <h1 class="page-title">
                Inventaris
            </h1>

            <p class="page-subtitle">
                Kelola stok barang dan persediaan toko.
            </p>

        </div>


        <button
            type="button"
            class="btn btn-primary"
            id="addProductButton"
        >

            <i class="fa-solid fa-plus me-2"></i>

            Tambah Produk

        </button>

    </div>



    <!-- STATS -->

    <div class="row g-3 mb-4">


        <!-- TOTAL PRODUK -->

        <div class="col-12 col-md-4">

            <div class="saku-card stat-card">

                <div class="d-flex align-items-center gap-3">

                    <div class="stat-icon">

                        <i class="fa-solid fa-boxes-stacked"></i>

                    </div>

                    <div>

                        <small class="text-muted">
                            Total Produk
                        </small>

                        <h4
                            class="fw-bold mb-0"
                            id="totalProducts"
                        >
                            -
                        </h4>

                    </div>

                </div>

            </div>

        </div>



        <!-- STOK MENIPIS -->

        <div class="col-12 col-md-4">

            <div class="saku-card stat-card">

                <div class="d-flex align-items-center gap-3">

                    <div class="stat-icon">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                    </div>

                    <div>

                        <small class="text-muted">
                            Stok Menipis
                        </small>

                        <h4
                            class="fw-bold mb-0"
                            id="lowStockProducts"
                        >
                            -
                        </h4>

                    </div>

                </div>

            </div>

        </div>



        <!-- STOK HABIS -->

        <div class="col-12 col-md-4">

            <div class="saku-card stat-card">

                <div class="d-flex align-items-center gap-3">

                    <div class="stat-icon">

                        <i class="fa-solid fa-circle-xmark"></i>

                    </div>

                    <div>

                        <small class="text-muted">
                            Stok Habis
                        </small>

                        <h4
                            class="fw-bold mb-0"
                            id="outOfStockProducts"
                        >
                            -
                        </h4>

                    </div>

                </div>

            </div>

        </div>


    </div>



    <!-- TABLE -->

    <div class="saku-card">


        <!-- SEARCH & FILTER -->

        <div class="saku-card-header">

            <div class="row g-2">

                <div class="col-12 col-md-8">

                    <div class="input-group">

                        <span class="input-group-text bg-white">

                            <i class="fa-solid fa-search"></i>

                        </span>

                        <input
                            type="text"
                            id="inventorySearch"
                            class="form-control"
                            placeholder="Cari produk..."
                        >

                    </div>

                </div>


                <div class="col-12 col-md-4">

                    <select
                        id="stockFilter"
                        class="form-select"
                    >

                        <option value="all">
                            Semua Status
                        </option>

                        <option value="Aman">
                            Aman
                        </option>

                        <option value="Menipis">
                            Menipis
                        </option>

                        <option value="Habis">
                            Habis
                        </option>

                    </select>

                </div>

            </div>

        </div>



        <!-- TABLE -->

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead>

                    <tr>

                        <th>Kode</th>

                        <th>Produk</th>

                        <th>Kategori</th>

                        <th>Stok</th>

                        <th>Harga</th>

                        <th>Status</th>

                        <th class="text-end">
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody id="inventoryTable">

                    <tr>

                        <td
                            colspan="7"
                            class="text-center py-4 text-muted"
                        >

                            <i class="fa-solid fa-spinner fa-spin me-2"></i>

                            Memuat data inventaris...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


</main>
```

</div>
