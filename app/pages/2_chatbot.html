<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SakuBot AI - SAKU POS</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>


<body>


<div class="saku-shell">


    <div id="sidebar-container"></div>


    <main class="saku-content">


        <div class="mb-4">

            <h1 class="page-title">
                SakuBot AI
            </h1>

            <p class="page-subtitle">
                Tanya kondisi bisnis kamu menggunakan bahasa sehari-hari.
            </p>

        </div>



        <div class="saku-card chat-container">


            <div class="saku-card-header">

                <div class="d-flex align-items-center gap-3">

                    <div class="stat-icon">

                        <i class="fa-solid fa-robot"></i>

                    </div>


                    <div>

                        <h5 class="fw-bold mb-1">
                            SakuBot
                        </h5>

                        <small class="text-success">

                            <i class="fa-solid fa-circle"></i>

                            Online

                        </small>

                    </div>

                </div>

            </div>



            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="chat-message bot">

                    <div class="chat-bubble">

                        Halo! 👋 Saya SakuBot.

                        <br><br>

                        Saya bisa membantu kamu melihat:

                        <ul class="mb-0 mt-2">

                            <li>Penjualan</li>

                            <li>Stok barang</li>

                            <li>Laba</li>

                            <li>Kondisi bisnis</li>

                        </ul>

                    </div>

                </div>

            </div>



            <div class="chat-input">

                <div class="input-group">

                    <input
                        type="text"
                        id="chatInput"
                        class="form-control"
                        placeholder="Tanyakan sesuatu..."
                    >

                    <button
                        class="btn btn-primary"
                        id="sendChat"
                    >

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>

                </div>

            </div>

        </div>


    </main>

</div>



<nav class="mobile-bottom-nav">

    <a href="1_kasir.html">
        <i class="fa-solid fa-cash-register"></i>
        <span>Kasir</span>
    </a>

    <a href="3_dashboard.html">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
    </a>

    <a href="4_inventaris.html">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>Stok</span>
    </a>

    <a
        href="2_chatbot.html"
        class="active"
    >
        <i class="fa-solid fa-robot"></i>
        <span>SakuBot</span>
    </a>

</nav>



<script src="../assets/js/sidebar.js"></script>

<script src="../assets/js/chatbot.js"></script>

</body>

</html>
