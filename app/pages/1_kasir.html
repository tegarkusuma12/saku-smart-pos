<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kasir - SAKU POS</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>


<body>


<div class="saku-shell">


    <div id="sidebar-container"></div>


    <main class="saku-content">


        <!-- HEADER -->

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

            <div>

                <h1 class="page-title">
                    Kasir
                </h1>

                <p class="page-subtitle">
                    Catat transaksi penjualan dengan cepat.
                </p>

            </div>


            <button
                class="btn btn-primary"
                onclick="newTransaction()"
            >

                <i class="fa-solid fa-plus me-2"></i>

                Transaksi Baru

            </button>

        </div>



        <div class="row g-4">


            <!-- PRODUCTS -->

            <div class="col-12 col-xl-8">


                <div class="saku-card mb-3">

                    <div class="p-3">

                        <div class="input-group">

                            <span class="input-group-text bg-white">

                                <i class="fa-solid fa-search"></i>

                            </span>

                            <input
                                type="text"
                                id="productSearch"
                                class="form-control"
                                placeholder="Cari produk..."
                            >

                        </div>

                    </div>

                </div>



                <div
                    id="productGrid"
                    class="row g-3"
                ></div>


            </div>



            <!-- CART -->

            <div class="col-12 col-xl-4">

                <div class="saku-card cart-panel">


                    <div class="saku-card-header">

                        <div class="d-flex justify-content-between">

                            <div>

                                <h5 class="fw-bold mb-1">
                                    Keranjang
                                </h5>

                                <p class="page-subtitle small">
                                    Produk yang dipilih
                                </p>

                            </div>


                            <span
                                id="cartCount"
                                class="badge text-bg-primary align-self-start"
                            >
                                0
                            </span>

                        </div>

                    </div>



                    <div
                        id="cartItems"
                        class="cart-items p-3"
                    >

                        <div class="text-center text-muted py-5">

                            <i class="fa-solid fa-cart-shopping fa-2x mb-3"></i>

                            <p class="mb-0">
                                Keranjang masih kosong
                            </p>

                        </div>

                    </div>



                    <div class="border-top p-3">


                        <div class="d-flex justify-content-between mb-2">

                            <span class="text-muted">
                                Subtotal
                            </span>

                            <strong id="subtotal">
                                Rp0
                            </strong>

                        </div>


                        <div class="d-flex justify-content-between mb-2">

                            <span class="text-muted">
                                Diskon
                            </span>

                            <strong id="discountAmount">
                                Rp0
                            </strong>

                        </div>


                        <div class="d-flex justify-content-between mb-3">

                            <span class="text-muted">
                                Pajak
                            </span>

                            <strong id="taxAmount">
                                Rp0
                            </strong>

                        </div>


                        <div class="d-flex justify-content-between border-top pt-3 mb-3">

                            <strong>
                                Total
                            </strong>

                            <strong
                                id="total"
                                class="text-primary fs-5"
                            >
                                Rp0
                            </strong>

                        </div>


                        <button
                            id="checkoutBtn"
                            class="btn btn-primary w-100"
                            onclick="openPaymentModal()"
                        >

                            <i class="fa-solid fa-check me-2"></i>

                            Checkout

                        </button>

                    </div>

                </div>

            </div>

        </div>


    <!-- Modal Pembayaran -->
    <div class="modal fade" id="modalPayment" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">Proses Pembayaran</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="bg-light p-3 rounded mb-3 text-center">
                        <small class="text-muted d-block">Total Tagihan</small>
                        <h2 class="text-primary fw-bold mb-0" id="payTotalAmount">Rp 0</h2>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Metode Pembayaran</label>
                        <select class="form-select" id="payMethod" onchange="togglePaymentFields()">
                            <option value="Cash">Tunai (Cash)</option>
                            <option value="QRIS">QRIS / Transfer</option>
                            <option value="Kasbon">Kasbon (Hutang)</option>
                        </select>
                    </div>

                    <!-- Fields for Kasbon -->
                    <div class="mb-3 d-none" id="payCustomerBlock">
                        <label class="form-label fw-semibold text-danger">Nama Pelanggan (Wajib)</label>
                        <input type="text" class="form-control" id="payCustomerName" placeholder="Masukkan nama pelanggan">
                    </div>

                    <!-- Fields for Cash -->
                    <div id="payCashBlock">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Uang Diterima</label>
                            <div class="input-group">
                                <span class="input-group-text">Rp</span>
                                <input type="number" class="form-control" id="payReceived" onkeyup="calculateChange()" placeholder="0">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center bg-white border p-2 rounded mb-2">
                            <span class="text-muted fw-semibold">Kembalian:</span>
                            <span class="fw-bold text-success fs-5" id="payChange">Rp 0</span>
                        </div>
                        <div class="d-flex gap-2 flex-wrap mb-3">
                            <button class="btn btn-outline-secondary btn-sm" onclick="setCash(20000)">20rb</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="setCash(50000)">50rb</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="setCash(100000)">100rb</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="setCash('pas')">Uang Pas</button>
                        </div>
                    </div>
                    
                    <div class="mb-3 mt-2">
                        <label class="form-label fw-semibold">Catatan (Opsional)</label>
                        <input type="text" class="form-control" id="payNotes" placeholder="Catatan transaksi...">
                    </div>

                    <button class="btn btn-primary w-100 py-2 mt-2" onclick="submitPayment()">
                        <i class="fa-solid fa-check me-2"></i> Konfirmasi Pembayaran
                    </button>
                </div>
            </div>
        </div>
    </div>
    </main>

</div>



<nav class="mobile-bottom-nav">

    <a
        href="1_kasir.html"
        class="active"
    >
        <i class="fa-solid fa-cash-register"></i>
        <span>Kasir</span>
    </a>

    <a href="3_dashboard.html">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
    </a>

    <a href="4_inventaris.html">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>Stok</span>
    </a>

    <a href="2_chatbot.html">
        <i class="fa-solid fa-robot"></i>
        <span>SakuBot</span>
    </a>

</nav>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/sidebar.js"></script>

<script src="../assets/js/kasir.js"></script>

</body>

</html>
