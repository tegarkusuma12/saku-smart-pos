<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasir - SAKU POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="saku-shell">
  <aside class="saku-sidebar">
    <a class="saku-brand" href="../index.html"><span class="saku-brand-icon"><i class="fas fa-wallet"></i></span><span class="saku-brand-text">SAKU POS</span></a>
    <nav class="saku-nav">
      <a class="saku-nav-link active" href="1_kasir.html"><i class="fas fa-cash-register"></i><span class="saku-nav-label">Kasir</span></a>
      <a class="saku-nav-link" href="3_dashboard.html"><i class="fas fa-chart-line"></i><span class="saku-nav-label">Dashboard</span></a>
      <a class="saku-nav-link" href="4_inventaris.html"><i class="fas fa-boxes-stacked"></i><span class="saku-nav-label">Inventaris</span></a>
      <a class="saku-nav-link" href="5_akuntansi.html"><i class="fas fa-book"></i><span class="saku-nav-label">Akuntansi</span></a>
      <a class="saku-nav-link" href="2_chatbot.html"><i class="fas fa-robot"></i><span class="saku-nav-label">SakuBot AI</span></a>
    </nav>
  </aside>

  <main class="saku-content">
    <div class="row g-3">
      <section class="col-12 col-xl-8">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div><h1 class="page-title">Kasir</h1><p class="page-subtitle">Pilih produk untuk menambahkan ke keranjang.</p></div>
          <div class="input-group" style="max-width:320px"><span class="input-group-text bg-white"><i class="fas fa-search"></i></span><input id="searchInput" class="form-control" placeholder="Cari produk..."></div>
        </div>
        <div class="row g-3" id="productGrid"></div>
      </section>

      <aside class="col-12 col-xl-4">
        <div class="saku-card cart-panel">
          <div class="saku-card-header d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0"><i class="fas fa-cart-shopping me-2 text-primary"></i>Keranjang</h5>
            <span class="badge text-bg-light" id="cartCount">0 item</span>
          </div>
          <div id="cartItems" class="cart-items p-3"></div>
          <div class="p-3 border-top">
            <div class="row g-2 mb-3">
              <div class="col-6"><label class="form-label small text-secondary">Diskon (%)</label><input type="number" id="inputDiscount" value="0" min="0" max="100" class="form-control text-end"></div>
              <div class="col-6"><label class="form-label small text-secondary">PPN (%)</label><input type="number" id="inputTax" value="0" min="0" max="100" class="form-control text-end"></div>
            </div>
            <div class="d-flex justify-content-between small mb-1"><span>Subtotal</span><strong id="valSubtotal">Rp0</strong></div>
            <div class="d-flex justify-content-between small mb-1 text-secondary"><span>Diskon</span><span id="valDiscount">-Rp0</span></div>
            <div class="d-flex justify-content-between small mb-2 text-secondary"><span>PPN</span><span id="valTax">Rp0</span></div>
            <div class="d-flex justify-content-between fs-5 fw-bold border-top pt-2 mb-3"><span>Total</span><span class="text-primary" id="valTotal">Rp0</span></div>
            <div id="actionCheckout"><button id="btnPay" class="btn btn-primary w-100 py-2 fw-semibold"><i class="fas fa-credit-card me-2"></i>Proses Bayar</button></div>
            <div id="actionSuccess" class="d-none flex-column gap-2">
              <div class="alert alert-success py-2 mb-0 text-center small fw-semibold">Transaksi berhasil!</div>
              <div class="d-flex gap-2"><button id="btnPrint" class="btn btn-dark flex-fill"><i class="fas fa-print me-1"></i>Cetak</button><button id="btnWA" class="btn btn-success flex-fill"><i class="fab fa-whatsapp me-1"></i>WA</button></div>
              <button id="btnNew" class="btn btn-light border w-100">Transaksi Baru</button>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>
</div>
<nav class="mobile-bottom-nav">
  <a class="active" href="1_kasir.html"><i class="fas fa-cash-register"></i><span>Kasir</span></a><a href="3_dashboard.html"><i class="fas fa-chart-line"></i><span>Dashboard</span></a><a href="4_inventaris.html"><i class="fas fa-boxes-stacked"></i><span>Stok</span></a><a href="5_akuntansi.html"><i class="fas fa-book"></i><span>Akuntansi</span></a><a href="2_chatbot.html"><i class="fas fa-robot"></i><span>AI</span></a>
</nav>
<script src="../assets/js/kasir.js"></script>
</body>
</html>
