<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Akuntansi - SAKU POS</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>


<body>


<div class="saku-shell">


    <div id="sidebar-container"></div>


    <main class="saku-content">


        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

            <div>

                <h1 class="page-title">
                    Akuntansi
                </h1>

                <p class="page-subtitle">
                    Kelola transaksi dan posisi keuangan usaha.
                </p>

            </div>


            <button
                class="btn btn-outline-primary"
                onclick="exportCSV()"
            >

                <i class="fa-solid fa-download me-2"></i>

                Export CSV

            </button>

        </div>



        <!-- BALANCE -->

        <div class="row g-3 mb-4">


            <div class="col-12 col-md-4">

                <div class="saku-card stat-card">

                    <div class="d-flex align-items-center gap-3">

                        <div class="stat-icon">

                            <i class="fa-solid fa-money-bill"></i>

                        </div>

                        <div>

                            <small class="text-muted">
                                Kas
                            </small>

                            <h4
                                id="cashValue"
                                class="fw-bold mb-0"
                            >
                                Rp0
                            </h4>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-12 col-md-4">

                <div class="saku-card stat-card">

                    <div class="d-flex align-items-center gap-3">

                        <div class="stat-icon">

                            <i class="fa-solid fa-box"></i>

                        </div>

                        <div>

                            <small class="text-muted">
                                Persediaan
                            </small>

                            <h4
                                id="stockValue"
                                class="fw-bold mb-0"
                            >
                                Rp0
                            </h4>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-12 col-md-4">

                <div class="saku-card stat-card">

                    <div class="d-flex align-items-center gap-3">

                        <div class="stat-icon">

                            <i class="fa-solid fa-scale-balanced"></i>

                        </div>

                        <div>

                            <small class="text-muted">
                                Ekuitas
                            </small>

                            <h4
                                id="equityValue"
                                class="fw-bold mb-0"
                            >
                                Rp0
                            </h4>

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- LEDGER -->

        <div class="saku-card">


            <div class="saku-card-header">

                <h5 class="fw-bold mb-1">
                    Buku Besar
                </h5>

                <p class="page-subtitle small">
                    Riwayat transaksi akuntansi.
                </p>

            </div>


            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead>

                        <tr>

                            <th>Tanggal</th>

                            <th>Akun</th>

                            <th>Keterangan</th>

                            <th class="text-end">
                                Debit
                            </th>

                            <th class="text-end">
                                Kredit
                            </th>

                        </tr>

                    </thead>


                    <tbody id="ledgerTable">

                    </tbody>

                </table>

            </div>

        </div>


    </main>

</div>



<nav class="mobile-bottom-nav">

    <a href="1_kasir.html">

        <i class="fa-solid fa-cash-register"></i>

        <span>Kasir</span>

    </a>


    <a href="3_dashboard.html">

        <i class="fa-solid fa-chart-line"></i>

        <span>Dashboard</span>

    </a>


    <a href="4_inventaris.html">

        <i class="fa-solid fa-boxes-stacked"></i>

        <span>Stok</span>

    </a>


    <a href="2_chatbot.html">

        <i class="fa-solid fa-robot"></i>

        <span>SakuBot</span>

    </a>

</nav>



<script src="../assets/js/sidebar.js"></script>

<script src="../assets/js/akuntansi.js"></script>

</body>

</html>
