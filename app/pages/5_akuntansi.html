<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akuntansi - SAKU POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="saku-shell">
  <aside class="saku-sidebar">
    <a class="saku-brand" href="../index.html"><span class="saku-brand-icon"><i class="fas fa-wallet"></i></span><span class="saku-brand-text">SAKU POS</span></a>
    <nav class="saku-nav">
      <a class="saku-nav-link" href="1_kasir.html"><i class="fas fa-cash-register"></i><span class="saku-nav-label">Kasir</span></a>
      <a class="saku-nav-link" href="3_dashboard.html"><i class="fas fa-chart-line"></i><span class="saku-nav-label">Dashboard</span></a>
      <a class="saku-nav-link" href="4_inventaris.html"><i class="fas fa-boxes-stacked"></i><span class="saku-nav-label">Inventaris</span></a>
      <a class="saku-nav-link active" href="5_akuntansi.html"><i class="fas fa-book"></i><span class="saku-nav-label">Akuntansi</span></a>
      <a class="saku-nav-link" href="2_chatbot.html"><i class="fas fa-robot"></i><span class="saku-nav-label">SakuBot AI</span></a>
    </nav>
  </aside>
  <main class="saku-content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div><h1 class="page-title">Laporan Akuntansi</h1><p class="page-subtitle">Ringkasan posisi keuangan dan buku besar.</p></div>
      <button onclick="exportCSV()" class="btn btn-success"><i class="fas fa-file-csv me-2"></i>Export CSV</button>
    </div>
    <div class="row g-3">
      <div class="col-12 col-xl-4">
        <div class="saku-card p-4 h-100">
          <h5 class="fw-bold mb-4"><i class="fas fa-scale-balanced me-2 text-primary"></i>Neraca</h5>
          <div class="d-flex justify-content-between border-bottom py-2"><span class="text-secondary">Kas & Bank</span><strong id="valAssetCash">Rp0</strong></div>
          <div class="d-flex justify-content-between border-bottom py-2"><span class="text-secondary">Nilai Stok</span><strong id="valAssetStock">Rp0</strong></div>
          <div class="d-flex justify-content-between border-bottom py-2"><span class="text-secondary">Hutang Supplier</span><strong class="text-danger" id="valLiability">Rp0</strong></div>
          <div class="d-flex justify-content-between pt-3 fs-5 fw-bold"><span>Total Ekuitas</span><span class="text-primary" id="valEquity">Rp0</span></div>
        </div>
      </div>
      <div class="col-12 col-xl-8">
        <div class="saku-card overflow-hidden">
          <div class="saku-card-header"><h5 class="fw-bold mb-0"><i class="fas fa-book-open me-2 text-primary"></i>Buku Besar</h5></div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light"><tr><th>Tanggal</th><th>Deskripsi</th><th class="text-end">Debit</th><th class="text-end">Kredit</th></tr></thead>
              <tbody id="ledgerTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<nav class="mobile-bottom-nav">
  <a href="1_kasir.html"><i class="fas fa-cash-register"></i><span>Kasir</span></a><a href="3_dashboard.html"><i class="fas fa-chart-line"></i><span>Dashboard</span></a><a href="4_inventaris.html"><i class="fas fa-boxes-stacked"></i><span>Stok</span></a><a class="active" href="5_akuntansi.html"><i class="fas fa-book"></i><span>Akuntansi</span></a><a href="2_chatbot.html"><i class="fas fa-robot"></i><span>AI</span></a>
</nav>
<script src="../assets/js/akuntansi.js"></script>
</body>
</html>
